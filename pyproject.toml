[project]
name = "hit-stocks-analysis"
version = "0.1.0"
description = "Python environment for outbound inventory data analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=18,<25",
    "openpyxl>=3.1,<4",
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I"]
